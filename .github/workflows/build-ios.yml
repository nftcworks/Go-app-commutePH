name: Build iOS IPA

on:
  workflow_dispatch: # Allows you to manually trigger the build from the GitHub Actions tab

jobs:
  build:
    name: Build iOS IPA
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Setup repository
        uses: actions/checkout@v4

      - name: 🏗 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 🏗 Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }} # Make sure to add EXPO_TOKEN to your GitHub repository secrets!

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🚀 Build IPA
        run: eas build --platform ios --profile preview --non-interactive
        env:
          # If you want EAS to automatically manage your Apple credentials, you may need to provide your Apple ID password as a secret, or let EAS prompt you locally once first.
          EXPO_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.EXPO_APPLE_APP_SPECIFIC_PASSWORD }}
