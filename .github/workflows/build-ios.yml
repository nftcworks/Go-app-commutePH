name: Build Unsigned iOS IPA

on:
  workflow_dispatch: # Allows manual triggering from GitHub Actions tab

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install dependencies
        run: npm install

      - name: Generate iOS project (Prebuild)
        run: npx expo prebuild -p ios --clean

      - name: Build unsigned IPA
        run: |
          cd ios
          # Auto-detect Workspace and Scheme
          WORKSPACE=$(ls | grep .xcworkspace | head -1)
          SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list | awk '/Schemes:/{getline; print $1}')
          
          echo "Building Workspace: $WORKSPACE, Scheme: $SCHEME"
          
          xcodebuild -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package into IPA
        run: |
          cd ios
          mkdir -p Payload
          # Move the compiled .app into the Payload folder
          mv build/Build/Products/Release-iphoneos/*.app Payload/
          # Zip it up into an IPA
          zip -r ../GoCommutePH-unsigned.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoCommutePH-unsigned-ipa
          path: GoCommutePH-unsigned.ipa
