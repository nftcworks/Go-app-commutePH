name: Build Unsigned iOS IPA

on:
  workflow_dispatch: # Allows manual triggering from GitHub Actions tab

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16.2
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install dependencies
        run: npm install

      - name: Generate iOS project (Prebuild)
        run: npx expo prebuild -p ios --clean

      - name: Suppress pod warnings and reinstall
        run: |
          cd ios
          # Insert inhibit_all_warnings! at top of Podfile to silence
          # nullability warnings in third-party pods (expo-modules-core, expo-file-system)
          sed -i '' '1s/^/inhibit_all_warnings!\
          /' Podfile
          cat Podfile | head -5
          pod install --repo-update

      - name: Build unsigned archive
        run: |
          cd ios
          # Auto-detect Workspace and Scheme
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          
          echo "Building Workspace: $WORKSPACE, Scheme: $SCHEME"
          
          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath unsigned.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            SKIP_INSTALL=NO \
            GCC_TREAT_WARNINGS_AS_ERRORS=NO

      - name: Package into IPA
        run: |
          cd ios
          # Debug: show archive structure
          echo "Archive contents:"
          find unsigned.xcarchive -name "*.app" -type d
          
          mkdir -p Payload
          # Find the compiled .app inside the archive
          APP_PATH=$(find unsigned.xcarchive -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: .app file not found inside the archive!"
            echo "Full archive structure:"
            find unsigned.xcarchive -type d
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          # Zip it up into an IPA
          zip -r ../GoCommutePH-unsigned.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoCommutePH-unsigned-ipa
          path: GoCommutePH-unsigned.ipa
